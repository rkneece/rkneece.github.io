name: Verify reviewed NI1 gallery
on:
  push:
    branches: [release/approved-north-island-farmhouse, main]
    paths:
      - releases/approved-north-island-farmhouse/**
      - .github/workflows/approved-island-verify.yml
permissions:
  contents: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[verify:ni1]') || contains(github.event.head_commit.message, '[live:ni1]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet Pillow
      - name: Check reviewed HTML and every embedded updated image
        run: python releases/approved-north-island-farmhouse/verify.py
      - name: Check live exact release when requested
        if: contains(github.event.head_commit.message, '[live:ni1]')
        run: python releases/approved-north-island-farmhouse/verify.py https://rkneece.github.io/sites/43cedar/interactive_map/index.html
      - name: Install browser test library
        run: npm install --prefix "$RUNNER_TEMP/ni1-browser" --no-save playwright
      - name: Desktop images and mobile test gallery
        env:
          NODE_PATH: ${{ runner.temp }}/ni1-browser/node_modules
        run: node releases/approved-north-island-farmhouse/check-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ni1-browser-${{ github.run_id }}
          path: |
            releases/approved-north-island-farmhouse/*QA.json
            releases/approved-north-island-farmhouse/*browser.png
