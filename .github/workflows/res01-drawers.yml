name: RES01 drawer and casing release
run-name: "RES01 drawers · ${{ github.ref_name }}"
on:
  push:
    branches: [release/res01-drawers, release/res01-drawers-live]
    paths: [releases/res01-drawers/draw_res01.py, releases/res01-drawers/apply.py, .github/workflows/res01-drawers.yml]
permissions:
  contents: write
  id-token: write
concurrency:
  group: res01-drawers-${{ github.ref }}
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Reproduce exact reviewed diagram and patch RES01 only
        run: |
          python releases/res01-drawers/draw_res01.py
          echo '67dd2aba39e1119a9eb3589eb0e4c29d2ef917bd1fe5a863aed2cc2a3a405a52  releases/res01-drawers/43_Cedar_Fireplace_Measured_Concept.png' | sha256sum --check
          python releases/res01-drawers/apply.py
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: cedar-assets
          workload_identity_provider: projects/293109622606/locations/global/workloadIdentityPools/cedar-github/providers/github
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Archive diagram, source, exact viewer and QA with independent readback
        run: |
          python ops/cedar-archive/archive.py --issue 31 --receipt releases/res01-drawers/ARCHIVE_RECEIPT.json releases/res01-drawers/draw_res01.py releases/res01-drawers/apply.py releases/res01-drawers/43_Cedar_Fireplace_Measured_Concept.png releases/res01-drawers/PUBLISH_QA.json sites/43cedar/interactive_map/index.html
      - name: Guard current head and commit reviewed output
        run: |
          test "$(git ls-remote origin refs/heads/${{ github.ref_name }} | cut -f1)" = "$GITHUB_SHA"
          git add releases/res01-drawers sites/43cedar/interactive_map/index.html
          git -c user.name='43 Cedar publish' -c user.email='actions@users.noreply.github.com' commit -m 'Assemble reviewed RES01 two Shaker drawers per side and standard casing [skip ci]'
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: res01-qa-${{ github.run_id }}
          path: |
            releases/res01-drawers/PUBLISH_QA.json
            releases/res01-drawers/ARCHIVE_RECEIPT.json
            releases/res01-drawers/43_Cedar_Fireplace_Measured_Concept.png
