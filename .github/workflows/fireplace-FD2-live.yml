name: Verify FD2 live publication
on:
  push:
    branches: [main]
    paths: [releases/fireplace-FD2/**, .github/workflows/fireplace-FD2-live.yml]
permissions:
  contents: read
  pages: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[live:fd2]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Observe Pages completion and independently verify live HTML hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python releases/fireplace-FD2/verify-live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fd2-live-${{ github.run_id }}
          path: releases/fireplace-FD2/LIVE_QA.json
