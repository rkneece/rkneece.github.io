name: Verify approved lighting subset live publication
on:
  push:
    branches: [main]
    paths: [releases/lighting-ready-4/**, .github/workflows/lighting-ready-4-live.yml]
permissions:
  contents: read
  pages: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[live:lighting-ready-4]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Observe Pages completion and verify exact live viewer hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python releases/lighting-ready-4/verify-live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighting-ready-4-live-${{ github.run_id }}
          path: releases/lighting-ready-4/LIVE_QA.json
