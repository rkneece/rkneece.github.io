name: Stage approved EW lighting subset release
on:
  push:
    branches: [release/lighting-ready-4]
    paths: [releases/lighting-ready-4/**, .github/workflows/lighting-ready-4-stage.yml]
permissions:
  contents: write
  id-token: write
concurrency:
  group: cedar-shared-publisher
  cancel-in-progress: false
jobs:
  assemble:
    if: contains(github.event.head_commit.message, '[assemble:lighting-ready-4]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDSDK_CONFIG: /tmp/lighting-ready-4-release-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet Pillow
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: cedar-assets
          workload_identity_provider: projects/293109622606/locations/global/workloadIdentityPools/cedar-github/providers/github
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Restore exact current baseline and verify eight archived image hashes
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "005b42d7772e24e26f71611721086bd1252c6025"
          git fetch --depth=1 origin main
          git show 005b42d7772e24e26f71611721086bd1252c6025:sites/43cedar/interactive_map/index.html > sites/43cedar/interactive_map/index.html
          python releases/lighting-ready-4/check-owner.py
          python releases/lighting-ready-4/assemble.py
      - name: Desktop and mobile eight-image browser checks
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node releases/lighting-ready-4/browser.cjs
      - name: Archive staged viewer and review evidence with independent readback
        run: |
          python releases/lighting-ready-4/check-owner.py
          python releases/lighting-ready-4/archive.py --issue 25 --receipt releases/lighting-ready-4/ARCHIVE_RECEIPT.json sites/43cedar/interactive_map/index.html releases/lighting-ready-4/RELEASE.json releases/lighting-ready-4/PUBLISH_QA.json releases/lighting-ready-4/BROWSER_QA.json
      - name: Preserve expected-head staged result
        run: |
          python releases/lighting-ready-4/check-owner.py
          test "$(git ls-remote origin refs/heads/release/lighting-ready-4 | cut -f1)" = "$GITHUB_SHA"
          git add sites/43cedar/interactive_map/index.html releases/lighting-ready-4/PUBLISH_QA.json releases/lighting-ready-4/BROWSER_QA.json releases/lighting-ready-4/ARCHIVE_RECEIPT.json
          git -c user.name='43 Cedar isolated FD2 publisher' -c user.email='actions@users.noreply.github.com' commit -m 'Stage eight approved EW lighting subset views; preserve production and other tests [skip ci]'
          git push origin HEAD:release/lighting-ready-4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighting-ready-4-release-${{ github.run_id }}
          path: |
            releases/lighting-ready-4/*QA.json
            releases/lighting-ready-4/*RECEIPT.json
            releases/lighting-ready-4/desktop.png
            releases/lighting-ready-4/mobile.png
