name: 43 Cedar HTML publish
run-name: "HTML publish · ${{ github.ref_name }}"
on:
  workflow_dispatch:
  push:
    branches: [main, dev, feature/photoreal40-live, release/res01-only, release/pd1-bedroom-only]
    paths: [sites/43cedar/interactive_map/**, releases/photoreal40/REVIEW.json, releases/double-doors/**, releases/mobile-ui/**, releases/required-post/**, releases/demo-20261023/**, releases/room-consolidation/**, releases/res01-only/**, releases/pd1-bedroom-only/**]
permissions:
  contents: write
  pages: write
concurrency:
  group: cedar-pages-refresh
  cancel-in-progress: false
jobs:
  assemble:
    if: (github.ref_name == 'release/pd1-bedroom-only' && contains(github.event.head_commit.message, '[assemble:pd1-bedroom]')) || (github.ref_name == 'release/res01-only' && contains(github.event.head_commit.message, '[assemble:res01]')) || github.ref_name == 'feature/photoreal40-live' || (github.ref_name == 'dev' && (contains(github.event.head_commit.message, '[assemble:double-doors]') || contains(github.event.head_commit.message, '[assemble:mobile-ui]') || contains(github.event.head_commit.message, '[assemble:required-post]') || contains(github.event.head_commit.message, '[assemble:demo-20261023]') || contains(github.event.head_commit.message, '[assemble:rooms]')))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet Pillow
      - name: Assemble only reviewed photographic counterparts
        if: github.ref_name == 'feature/photoreal40-live'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python releases/photoreal40/assemble.py
      - name: Assemble approved five-panel double-door images and mappings
        if: github.ref_name == 'dev' && contains(github.event.head_commit.message, '[assemble:double-doors]')
        run: python releases/double-doors/assemble.py
      - name: Commit reviewed double-door viewer on development branch
        if: github.ref_name == 'dev' && contains(github.event.head_commit.message, '[assemble:double-doors]')
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$GITHUB_SHA"
          git add sites/43cedar/interactive_map/index.html releases/double-doors/PUBLISH_QA.json
          git -c user.name='43 Cedar publish' -c user.email='actions@users.noreply.github.com' commit -m 'Assemble approved DD1 five-panel double-door images and mappings [skip ci]'
          git push origin HEAD:dev
      - name: Assemble and verify the mobile navigation around current photo data
        if: github.ref_name == 'dev' && contains(github.event.head_commit.message, '[assemble:mobile-ui]')
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$GITHUB_SHA"
          node --check releases/mobile-ui/viewer.js
          node releases/mobile-ui/test_panzoom.cjs
          python releases/mobile-ui/apply_mobile_ui.py
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$GITHUB_SHA"
          git add sites/43cedar/interactive_map/index.html releases/mobile-ui/ASSEMBLY_QA.json
          git -c user.name='43 Cedar publish' -c user.email='actions@users.noreply.github.com' commit -m 'Assemble reviewed mobile navigation; preserve all embedded photos and mappings [skip ci]'
          git push origin HEAD:dev
      - name: Assemble reviewed required-post images and diagrams
        if: github.ref_name == 'dev' && contains(github.event.head_commit.message, '[assemble:required-post]')
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$GITHUB_SHA"
          python releases/required-post/verify_inputs.py
          python releases/required-post/apply_required_post_release.py sites/43cedar/interactive_map/index.html sites/43cedar/interactive_map/index.html --external-assets
          python releases/required-post/verify_release.py
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$GITHUB_SHA"
          git add sites/43cedar/interactive_map/index.html sites/43cedar/interactive_map/assets releases/required-post/REQUIRED_POST_PUBLISH_QA.json
          git -c user.name='43 Cedar publish' -c user.email='actions@users.noreply.github.com' commit -m 'Assemble reviewed P135 required post images, maps and diagrams [skip ci]'
          git push origin HEAD:dev
      - name: Append and verify October 23 demolition photos
        if: github.ref_name == 'dev' && contains(github.event.head_commit.message, '[assemble:demo-20261023]')
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$GITHUB_SHA"
          python releases/demo-20261023/assemble.py
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$GITHUB_SHA"
          git add sites/43cedar/interactive_map/index.html releases/demo-20261023/labels.json releases/demo-20261023/PUBLISH_QA.json
          git -c user.name='43 Cedar publish' -c user.email='actions@users.noreply.github.com' commit -m 'Assemble October 23 demo photos and estimated floor mappings [skip ci]'
          git push origin HEAD:dev
      - name: Consolidate room aliases and verify desktop and mobile filters
        if: github.ref_name == 'dev' && contains(github.event.head_commit.message, '[assemble:rooms]')
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$GITHUB_SHA"
          python releases/room-consolidation/apply.py sites/43cedar/interactive_map/index.html sites/43cedar/interactive_map/index.html
          node --check releases/mobile-ui/viewer.js
          npm install --prefix "$RUNNER_TEMP/cedar-room-qa" --no-save playwright
          NODE_PATH="$RUNNER_TEMP/cedar-room-qa/node_modules" CEDAR_BROWSER=/usr/bin/google-chrome node releases/room-consolidation/check-rooms.cjs sites/43cedar/interactive_map/index.html
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$GITHUB_SHA"
          git add sites/43cedar/interactive_map/index.html releases/mobile-ui/viewer.js releases/room-consolidation/QA.json releases/room-consolidation/BROWSER_QA.json
          git -c user.name='43 Cedar publish' -c user.email='actions@users.noreply.github.com' commit -m 'Assemble consolidated room labels; preserve photos and camera mappings [skip ci]'
          git push origin HEAD:dev
      - name: Assemble approved RES01 illustration only
        if: github.ref_name == 'release/res01-only' && contains(github.event.head_commit.message, '[assemble:res01]')
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/release/res01-only | cut -f1)" = "$GITHUB_SHA"
          python releases/res01-only/assemble_res01.py
          git add sites/43cedar/interactive_map/index.html
          git -c user.name='43 Cedar publish' -c user.email='actions@users.noreply.github.com' commit -m 'Assemble approved RES01 measured fireplace concept only [skip ci]'
          git push origin HEAD:release/res01-only
      - name: Assemble only approved B100 and R65 bedroom-door images
        if: github.ref_name == 'release/pd1-bedroom-only' && contains(github.event.head_commit.message, '[assemble:pd1-bedroom]')
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/release/pd1-bedroom-only | cut -f1)" = "$GITHUB_SHA"
          python releases/pd1-bedroom-only/assemble.py
          test "$(git ls-remote origin refs/heads/release/pd1-bedroom-only | cut -f1)" = "$GITHUB_SHA"
          git add sites/43cedar/interactive_map/index.html releases/pd1-bedroom-only/PUBLISH_QA.json
          git -c user.name='43 Cedar publish' -c user.email='actions@users.noreply.github.com' commit -m 'Assemble reviewed PD1 bedroom pair B100/R65 only [skip ci]'
          git push origin HEAD:release/pd1-bedroom-only
  publish:
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Request existing Pages build of current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/rkneece/rkneece.github.io/pages/builds
      - name: Retire fully merged temporary render branch
        if: contains(github.event.head_commit.message, '[retire:photoreal40]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json,os,urllib.request
          base='https://api.github.com/repos/rkneece/rkneece.github.io'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def get(p):
            with urllib.request.urlopen(urllib.request.Request(base+p,headers=headers)) as r:return json.load(r)
          branch='feature/photoreal40-live'
          head=get('/git/ref/heads/'+branch)['object']['sha']
          assert get('/compare/main...'+head)['ahead_by']==0
          assert get('/git/ref/heads/'+branch)['object']['sha']==head
          with urllib.request.urlopen(urllib.request.Request(base+'/git/refs/heads/'+branch,headers=headers,method='DELETE')) as r:assert r.status==204

      - name: Retire fully merged mobile navigation branch
        if: contains(github.event.head_commit.message, '[retire:mobile-ui]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request
          base = 'https://api.github.com/repos/rkneece/rkneece.github.io'
          headers = {'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path, headers=headers)) as response:
                  return json.load(response)
          branch = 'feature/mobile-navigation'
          head = get('/git/ref/heads/'+branch)['object']['sha']
          for target in ['dev', 'main']:
              assert get('/compare/'+target+'...'+head)['ahead_by'] == 0
          assert get('/git/ref/heads/'+branch)['object']['sha'] == head
          with urllib.request.urlopen(urllib.request.Request(base+'/git/refs/heads/'+branch, headers=headers, method='DELETE')) as response:
              assert response.status == 204


      - name: Retire published demo and superseded release branches
        if: contains(github.event.head_commit.message, '[retire:demo-20261023]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          base='https://api.github.com/repos/rkneece/rkneece.github.io'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def call(path, method='GET', body=None):
              request=urllib.request.Request(base+path,headers=headers,method=method,data=json.dumps(body).encode() if body is not None else None)
              with urllib.request.urlopen(request) as response:
                  return json.load(response) if response.status!=204 else None
          branches=['release/demo-20261023','fix/primary-bedroom-door','release/required-post-135','release/dining-blue-canvas','release/exterior-publication','release/fireplace-65-resources','release/fireplace-bpr-white','release/zillow-exterior']
          for branch in branches:
              try: head=call('/git/ref/heads/'+branch)['object']['sha']
              except urllib.error.HTTPError as e:
                  if e.code==404: continue
                  raise
              merged=all(call('/compare/'+target+'...'+head)['ahead_by']==0 for target in ['dev','main'])
              if branch=='release/demo-20261023': assert merged, 'Current demo branch must be merged first'
              # Older squash-published release snapshots retain their original commits as tags.
              if not merged:
                  tag='refs/tags/archive/retired-20261023/'+branch
                  try: call('/git/refs','POST',{'ref':tag,'sha':head})
                  except urllib.error.HTTPError as e:
                      if e.code!=422: raise
                      assert call('/git/ref/tags/archive/retired-20261023/'+branch)['object']['sha']==head
              assert call('/git/ref/heads/'+branch)['object']['sha']==head
              call('/git/refs/heads/'+branch,'DELETE')
              print('Retired',branch,'merged' if merged else 'preserved in archive tag')

