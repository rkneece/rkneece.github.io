name: 43 Cedar HTML publish
run-name: "HTML publish · request production Pages refresh"
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
  pages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Request build of the current protected production branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/rkneece/rkneece.github.io/pages/builds
