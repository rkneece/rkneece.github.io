name: 43 Cedar HTML publish
run-name: "HTML publish · stop redundant verification rerun"
on:
  pull_request:
    branches: [main]
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel redundant QA rerun after successful verified publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/rkneece/rkneece.github.io/actions/runs/39828524522/cancel
