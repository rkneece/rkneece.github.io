name: 43 Cedar HTML publish
run-name: "HTML publish · 65-inch TV, white mantel and Proposed Resources"
on:
  push:
    branches: [release/fireplace-65-resources]
    paths: [releases/fireplace-ff5/**]
permissions:
  contents: write
concurrency:
  group: cedar-html-production
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify approved viewer
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import urllib.request,pathlib,json
          release=json.loads(pathlib.Path('releases/fireplace-ff5/fireplace-release.json').read_text())
          url='https://raw.githubusercontent.com/rkneece/rkneece.github.io/'+release['base_public_commit']+'/sites/43cedar/interactive_map/index.html'
          pathlib.Path('releases/fireplace-ff5/live-before.html').write_bytes(urllib.request.urlopen(url).read())
          PY
          python releases/fireplace-ff5/apply_fireplace_release.py
      - name: Prepare production commit for guarded publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,json,os,pathlib,urllib.request
          root=pathlib.Path('releases/fireplace-ff5')
          qa=json.loads((root/'PUBLISH_QA.json').read_text())
          base='https://api.github.com/repos/rkneece/rkneece.github.io'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          def api(path,payload=None):
              request=urllib.request.Request(base+path,data=None if payload is None else json.dumps(payload).encode(),headers=headers,method='GET' if payload is None else 'POST')
              with urllib.request.urlopen(request) as response:return json.load(response)
          head=api('/git/ref/heads/main')['object']['sha']
          commit=api('/git/commits/'+head)
          current=api('/contents/sites/43cedar/interactive_map/index.html?ref='+head)
          assert current['sha']==qa['base_blob_sha'],'Production changed concurrently'
          blob=api('/git/blobs',{'content':base64.b64encode((root/'index.html').read_bytes()).decode(),'encoding':'base64'})
          assert blob['sha']==qa['output_blob_sha']
          tree=api('/git/trees',{'base_tree':commit['tree']['sha'],'tree':[{'path':'sites/43cedar/interactive_map/index.html','mode':'100644','type':'blob','sha':blob['sha']}]})
          prepared=api('/git/commits',{'message':'Publish 65-inch fireplace alcove and Proposed Resources; preserve exterior release','tree':tree['sha'],'parents':[head]})
          print('APPROVED_PRODUCTION_COMMIT='+prepared['sha'])
          print('EXPECTED_PRODUCTION_HEAD='+head)
          print('APPROVED_HTML_BLOB='+blob['sha'])
          print('Production branch is unchanged; connected GitHub publishes with a head guard.')
