name: Coordinated viewer release
on:
  push:
    branches: [dev, main]
    paths: ['releases/coordination9/**', '.github/workflows/coordinated-publish.yml']
permissions:
  contents: write
concurrency:
  group: cedar-pages-refresh
  cancel-in-progress: false
jobs:
  assemble:
    if: github.ref_name == 'dev' && contains(github.event.head_commit.message, '[assemble:coord9]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet Pillow
      - name: Assemble reviewed images while retaining unrelated live content
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$GITHUB_SHA"
          python releases/coordination9/assemble.py
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$GITHUB_SHA"
          git add sites/43cedar/interactive_map releases/coordination9/PUBLISH_QA.json
          git -c user.name='43 Cedar coordinator' -c user.email='actions@users.noreply.github.com' commit -m 'Assemble reviewed COORD9 combined-source images and source links [skip ci]'
          git push origin HEAD:dev
  retire:
    if: github.ref_name == 'main' && contains(github.event.head_commit.message, '[retire:coordination9]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python releases/coordination9/retire_branches.py
